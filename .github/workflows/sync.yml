name: Sync profiles

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # run once every 24 hours at 03:00 UTC

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Dictionarry snapshot
        run: python3 build_db.py --deps .deps --db .deps/dictionarry.sqlite

      - name: Convert profiles
        run: python3 convert.py --db .deps/dictionarry.sqlite --out profiles

      - name: Sanity check outputs
        run: |
          python3 - <<'EOF'
          import glob, json
          import sys
          exprs = glob.glob('profiles/*.expressions.json')
          regexes = glob.glob('profiles/*.regexes.json')
          assert len(exprs) == len(regexes) and exprs, 'unexpected output set'
          for f in exprs + regexes:
              data = json.load(open(f))
              assert isinstance(data, list), f'{f} is not a list'
              for item in data:
                  assert isinstance(item.get('expression') or item.get('pattern'), str), f.strip()
          print(f'ok: {len(exprs)} expression + {len(regexes)} regex files')
          EOF

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add profiles
          if git diff --cached --quiet; then
            echo 'no profile changes to commit'
            exit 0
          fi
          git commit -m 'chore(profiles): sync from Dictionarry'
          git push origin main